<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حاسبة أقساط السيارات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator-card">
  <h2>حاسبة تقسيط السيارات</h2>
  
  <div class="input-field">
    <label for="carPrice">سعر السيارة</label>
    <input type="number" id="carPrice" value="800000">
  </div>

  <div class="input-field">
    <label for="depositAmount">المقدم</label>
    <input type="number" id="depositAmount" value="200000">
  </div>

  <div class="input-field">
    <label for="durationYears">مدة التقسيط</label>
    <select id="durationYears">
      <option value="1">سنة واحدة</option>
      <option value="2">سنتين</option>
      <option value="3" selected>3 سنوات</option>
      <option value="4">4 سنوات</option>
      <option value="5">5 سنوات</option>
      <option value="7">7 سنوات</option>
    </select>
  </div>

  <div class="actions">
    <button type="button" id="calcBtn" onclick="calculate()">احسب</button>
    <button type="button" id="resetBtn" onclick="clearData()">مسح</button>
  </div>

  <div id="summaryPanel" class="summary-panel" style="display: none;">
    <h3>نتيجة الحساب</h3>
    <div class="info-box">
      <p>المبلغ المتبقي: <strong id="outLoan">0</strong> ج.م</p>
      <p>نسبة الفائدة: <strong id="outRate">0%</strong></p>
      <p>إجمالي الفائدة: <strong id="outProfit">0</strong> ج.م</p>
      <p>الإجمالي المطلوب: <strong id="outTotal">0</strong> ج.م</p>
      <p>عدد الشهور: <strong id="outMonths">0</strong> شهر</p>
      <hr>
      <p class="highlight">القسط الشهري: <span id="outMonthly">0</span> ج.م</p>
    </div>
  </div>
</div>

<script>
  function calculate() {
    let price = Number(document.getElementById('carPrice').value);
    let deposit = Number(document.getElementById('depositAmount').value);
    let years = Number(document.getElementById('durationYears').value);

    let loanAmount = price - deposit;
    let profitRate = 0;

    if (years == 1) { profitRate = 0.10; }
    else if (years == 2) { profitRate = 0.18; }
    else if (years == 3) { profitRate = 0.29; }
    else if (years == 4) { profitRate = 0.38; }
    else if (years == 5) { profitRate = 0.49; }
    else if (years == 7) { profitRate = 0.79; }

    let totalProfit = loanAmount * profitRate;
    let netTotal = loanAmount + totalProfit;
    let totalMonths = years * 12;
    let monthlyPayment = netTotal / totalMonths;

    document.getElementById('outLoan').textContent = loanAmount;
    document.getElementById('outRate').textContent = (profitRate * 100) + '%';
    document.getElementById('outProfit').textContent = totalProfit;
    document.getElementById('outTotal').textContent = netTotal;
    document.getElementById('outMonths').textContent = totalMonths;
    document.getElementById('outMonthly').textContent = monthlyPayment.toFixed(2);

    document.getElementById('summaryPanel').style.display = 'block';
  }

  function clearData() {
    document.getElementById('carPrice').value = '';
    document.getElementById('depositAmount').value = '';
    document.getElementById('summaryPanel').style.display = 'none';
  }
</script>

</body>
</html>
